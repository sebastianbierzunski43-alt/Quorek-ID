
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUOREK ID</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#101010;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:440px;background:#222;border:1px solid #444;border-radius:22px;padding:28px;text-align:center}
.logo{font-size:42px;font-weight:900;color:#ddd}
p{color:#aaa}
input{width:100%;padding:14px;margin:9px 0;background:#151515;color:white;border:1px solid #555;border-radius:10px;font-size:16px}
button{padding:13px;background:#555;color:white;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{background:#777}
.actions button{width:100%;margin-top:10px}
.hidden{display:none}
#message{min-height:22px;color:#ddd;font-size:14px}
#avatarList{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}
.avatar{background:#333;padding:5px;border:2px solid transparent;border-radius:12px}
.avatar img{width:100%;display:block;border-radius:8px}
.avatar.selected{border-color:white}
#profileAvatar{width:100px;height:100px;object-fit:cover;border-radius:20px}
.small{font-size:13px;color:#999}
</style>
</head>
<body>
<main class="card">
  <div class="logo">♛ Q</div>
  <h1>QUOREK ID</h1>
  <p>Jedno konto. Wszystkie gry.</p>

  <section id="auth">
    <input id="email" type="email" placeholder="Adres e-mail" autocomplete="email">
    <input id="password" type="password" placeholder="Hasło" autocomplete="current-password">
    <div class="actions">
      <button id="login">ZALOGUJ SIĘ</button>
      <button id="register">UTWÓRZ KONTO</button>
    </div>
  </section>

  <section id="profile" class="hidden">
    <h2>Twój profil</h2>
    <img id="profileAvatar" alt="Awatar gracza">
    <h3 id="username"></h3>
    <p class="small">QUOREK ID PLAYER</p>

    <div id="usernameArea">
      <input id="newUsername" placeholder="Twój nick (3–16 znaków)">
      <button id="saveUsername">USTAW NICK</button>
    </div>

    <h3>Wybierz awatar</h3>
    <div id="avatarList"></div>
    <button id="logout" style="width:100%;margin-top:20px">WYLOGUJ SIĘ</button>
  </section>

  <p id="message"></p>
  <p class="small">Twój świat gier Quorek.</p>
</main>

<script>
const SUPABASE_URL = "https://jmzziupnoxmvahtkmchz.supabase.co";
const SUPABASE_KEY = "sb_publishable_BZwA65yDsvBHD5FB_yzy1Q_x2AxfZtD";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const avatars = [
"01_cat_headphones.png","02_wolf.png","03_panda.png",
"04_fox.png","05_dragon.png","06_robot.png",
"07_pixel_creature.png","08_royal_penguin.png","09_alien.png",
"10_ghost.png","11_shark.png","12_ninja.png",
"13_unicorn.png","14_bear.png","15_star.png",
"16_wolf_howl.png","17_slime.png","18_knight.png",
"19_cat_dino_hood.png","20_octopus.png"
];

const auth = document.getElementById("auth");
const profile = document.getElementById("profile");
const message = document.getElementById("message");
const avatarList = document.getElementById("avatarList");

function say(text) {
  message.textContent = text;
}

function showProfile(show) {
  auth.classList.toggle("hidden", show);
  profile.classList.toggle("hidden", !show);
}

async function loadProfile(user) {
  const {data, error} = await db
    .from("profiles")
    .select("username, avatar, username_changed")
    .eq("id", user.id)
    .single();

  if(error) {
    say("Nie udało się pobrać profilu: " + error.message);
    return;
  }

  document.getElementById("username").textContent = data.username;
  document.getElementById("profileAvatar").src =
    "./avatars/" + data.avatar;

  document.getElementById("usernameArea").classList.toggle(
    "hidden", data.username_changed
  );

  avatarList.innerHTML = "";

  avatars.forEach(file => {
    const button = document.createElement("button");
    button.className = "avatar";
    if(file === data.avatar) button.classList.add("selected");

    const img = document.createElement("img");
    img.src = "./avatars/" + file;
    img.alt = "Awatar";

    button.appendChild(img);
    button.onclick = () => changeAvatar(file);

    avatarList.appendChild(button);
  });

  showProfile(true);
  say("Zalogowano pomyślnie!");
}

async function changeAvatar(file) {
  say("Zmieniam awatar...");

  const {error} = await db.rpc("set_avatar", {
    new_avatar: file
  });

  if(error) {
    say("Błąd: " + error.message);
    return;
  }

  const {data: {user}} = await db.auth.getUser();
  await loadProfile(user);
}

document.getElementById("register").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || password.length < 6) {
    say("Wpisz e-mail i hasło (minimum 6 znaków).");
    return;
  }

  say("Tworzę konto...");

  const {data, error} = await db.auth.signUp({
    email, password
  });

  if(error) {
    say("Błąd: " + error.message);
    return;
  }

  if(data.session) {
    await loadProfile(data.user);
  } else {
    say("Konto utworzone! Sprawdź pocztę i potwierdź e-mail.");
  }
};

document.getElementById("login").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  say("Loguję...");

  const {data, error} = await db.auth.signInWithPassword({
    email, password
  });

  if(error) {
    say("Błąd: " + error.message);
    return;
  }

  await loadProfile(data.user);
};

document.getElementById("saveUsername").onclick = async () => {
  const username = document.getElementById("newUsername").value.trim();

  say("Zapisuję nick...");

  const {error} = await db.rpc("set_username", {
    new_username: username
  });

  if(error) {
    say("Błąd: " + error.message);
    return;
  }

  const {data: {user}} = await db.auth.getUser();
  await loadProfile(user);
};

document.getElementById("logout").onclick = async () => {
  await db.auth.signOut();
  showProfile(false);
  say("Wylogowano.");
};

db.auth.onAuthStateChange((event, session) => {
  if(event === "SIGNED_IN" && session) {
    loadProfile(session.user);
  }
});

(async () => {
  const {data: {session}} = await db.auth.getSession();
  if(session) await loadProfile(session.user);
})();
</script>
</body>
</html>
