
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quorek ID</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: #242424;
      border: 1px solid #444;
      border-radius: 22px;
      padding: 35px;
      width: 100%;
      max-width: 390px;
      text-align: center;
    }
    .logo {
      font-size: 42px;
      font-weight: 900;
      color: #ddd;
    }
    p { color: #aaa; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 13px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      background: #171717;
      color: white;
      border: 1px solid #555;
    }
    button {
      background: #555;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #777; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">♛ Q</div>
    <h1>QUOREK ID</h1>
    <p>Jedno konto. Wszystkie gry.</p>
    <input type="email" placeholder="Adres e-mail">
    <input type="password" placeholder="Hasło">
    <button type="button">ZALOGUJ SIĘ</button>
    <button type="button">UTWÓRZ KONTO</button>
    <p>Twój świat gier Quorek.</p>
  </main>
</body>
</html>
